[package]
name = "run_cmd"
version = "0.1.0"
description = "A desktop command runner for frontend projects"
authors = ["Run Cmd"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "run_cmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
