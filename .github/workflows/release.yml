name: Tauri Build Windows and macOS

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles dmg --no-sign
            rust-targets: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg --no-sign
            rust-targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        if: matrix.rust-targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: run-cmd-v__VERSION__
          releaseName: "Run Cmd v__VERSION__"
          releaseBody: "Windows and macOS installers generated by GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
